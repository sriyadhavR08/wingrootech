# HTTPS Server Configuration for Elastic Beanstalk
server {
    listen 443 ssl;
    server_name backend.wingrootechnologies.com;

    ssl_certificate        /etc/letsencrypt/live/backend.wingrootechnologies.com/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/backend.wingrootechnologies.com/privkey.pem;

    ssl_session_timeout  1d;
    ssl_session_cache    shared:SSL:50m;
    ssl_session_tickets  off;

    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    # Static media folder serving
    location /media/ {
        alias /var/app_media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /uploads/ {
        alias /var/app_media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all API requests to Flask application (Gunicorn port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

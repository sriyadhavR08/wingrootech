name: QA & CI Test Suite

on:
  push:
    branches:
      - '**' # Triggers on all branches (dev, main, feature/*)
  pull_request:
    branches:
      - qa-testing
      - dev
      - main

jobs:
  # -----------------------------------------------------------
  # 1. FRONTEND QA: Build & Syntax Validation
  # -----------------------------------------------------------
  frontend-qa:
    name: Frontend QA (Vite Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Production Build
        working-directory: ./frontend
        run: npm run build

  # -----------------------------------------------------------
  # 2. BACKEND QA: API, Database & Services Validation
  # -----------------------------------------------------------
  backend-qa:
    name: Backend QA (API & Integration Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax & Compilation
        run: |
          python -m compileall backend/

      - name: Run Backend QA Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:///ci_qa_test.db
          SECRET_KEY: wingroo-ci-test-key-2026
        run: |
          python test_qa.py

      - name: Verify Database Migrations Consistency
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:///ci_qa_test.db
          FLASK_APP: app.py
        run: |
          python -m flask db current || true

      - name: Run E2E Health & Integration QA Check
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:///ci_qa_test.db
          SECRET_KEY: wingroo-ci-test-key-2026
        run: |
          python -c "from app import create_app; app = create_app(); client = app.test_client(); res = client.get('/api/health'); assert res.status_code == 200; print('CI E2E Health Check Passed!')"
